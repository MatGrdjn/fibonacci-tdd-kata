[project]
name = "fibonacci-kata"
version = "0.1.0"
description = "A TDD kata: Fibonacci, from notebook exploration to a tested, published package"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mathieu Grandjean", email = "mathieu.grandjean@etu.imt-nord-europe.fr" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fibonacci_kata"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "marimo>=0.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = ["notebooks"]
