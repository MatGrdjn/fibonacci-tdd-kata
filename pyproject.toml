[project]
name = "fibonacci-kata"
version = "0.1.0"
description = "A TDD kata: Fibonacci, from notebook exploration to a tested, published package"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mathieu Grandjean", email = "mathieu.grandjean@etu.imt-nord-europe.fr" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fibonacci_kata"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "marimo>=0.10",
    "mypy>=2.3.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.per-file-ignores]
# Autorise les expressions seules dans les notebooks Marimo
"notebooks/*.py" = ["B018"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90
